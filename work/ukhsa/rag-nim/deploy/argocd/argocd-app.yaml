apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-rag-blueprint
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/NVIDIA/NVIDIA-AI-Blueprints.git
    targetRevision: main
    path: rag/deploy/helm/nvidia-blueprint-rag
    helm:
      valueFiles:
        - values.yaml
        - values-nim.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-rag
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
