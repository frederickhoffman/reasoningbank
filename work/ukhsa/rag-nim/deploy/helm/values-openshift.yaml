# This file provides declarative overrides for deploying to Red Hat OpenShift.
runtimeClassName: "nvidia"

# subsection: rag-server
serviceAccount:
  create: true
  name: "rag-server"

imagePullSecret:
  name: "ngc-secret"
  create: false # Assumes secret is already created as per README

# -- Resource scheduling for OpenShift GPU nodes
nodeSelector:
  nvidia.com/gpu.present: "true"

# subsection: ingestor-server
ingestor-server:
  persistence:
    # Set this to your OpenShift storage class (e.g., "ocs-storagecluster-ceph-rbd")
    # If empty, the cluster's default storage class will be used.
    storageClass: ""
  
  nodeSelector:
    nvidia.com/gpu.present: "true"

# subsection: nim-operator
# Overrides for models managed by the NIM Operator
nimOperator:
  nim-llm:
    storage:
      pvc:
        storageClass: ""
    resources:
      limits:
        nvidia.com/GH100_H200_SXM_141GB: 1
      requests:
        nvidia.com/GH100_H200_SXM_141GB: 1
  nvidia-nim-llama-32-nv-embedqa-1b-v2:
    storage:
      pvc:
        storageClass: ""
    resources:
      limits:
        nvidia.com/GH100_H200_SXM_141GB: 1
      requests:
        nvidia.com/GH100_H200_SXM_141GB: 1

# -- Explicit override for Reranking NIM resource name
"nvidia-nim-llama-32-nv-rerankqa-1b-v2":
  resources:
    limits:
      nvidia.com/GH100_H200_SXM_141GB: 1
    requests:
      nvidia.com/GH100_H200_SXM_141GB: 1
# subsection: nv-ingest
# Milvus configuration for OpenShift (disabling GPU for broader scheduling)
nv-ingest:
  milvus:
    image:
      all:
        tag: "v2.5.5"
    standalone:
      # -- Fix for OpenShift SecurityContext (Handling random UID and permissions)
      podSecurityContext:
        enabled: true
      securityContext:
        enabled: true
        # We don't specify runAsUser so OpenShift can assign its own
      resources:
        limits:
          nvidia.com/gpu: 0
          cpu: "2"
          memory: "4Gi"
        requests:
          nvidia.com/gpu: 0
          cpu: "1"
          memory: "2Gi"
